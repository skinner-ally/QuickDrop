<!doctype html>
<html lang="ru" class="pixel sc-autumn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Значки QuickDrop — витрина</title>
    <!--
      Витрина только для разработки: npm run dev → /src/components/icons/gallery.html. В сборку не попадает.
      Цвета «Осени» (день и ночь) повторены здесь из scenes.css намеренно: обе палитры нужны на странице сразу,
      а значки обязаны читаться и без подключённых стилей сцен (запасные значения PALETTE).
    -->
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 13px/1.4 system-ui, sans-serif;
        background: #4a2416;
        color: #f7e0ac;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      h3 {
        margin: 20px 0 8px;
        font-size: 13px;
        color: var(--ink-dim);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }
      .top button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
      }
      .day {
        --paper: #f7e0ac;
        --paper-2: #eecb8c;
        --paper-line: #c9985a;
        --ink: #4a2f1b;
        --ink-dim: #725337;
        --brand: #c2452d;
        --brand-foreground: #fff3da;
        --gold: #f2c14e;
        --danger: #a8261d;
        --wood-dark: #4a2416;
      }
      .night {
        --paper: #32263a;
        --paper-2: #291f30;
        --paper-line: #56405c;
        --ink: #f1e5c6;
        --ink-dim: #a69d90;
        --brand: #e2764e;
        --brand-foreground: #24160f;
        --gold: #f6cf62;
        --danger: #ff8f7d;
        --wood-dark: #170f18;
      }
      .panel {
        background: var(--paper-2);
        color: var(--ink);
        padding: 16px;
        margin-bottom: 16px;
      }
      .cells {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 4px;
      }
      .cell {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border: 2px solid var(--paper-line);
      }
      .slot {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }
      .slot.s {
        width: 24px;
      }
      .slot.m {
        width: 30px;
      }
      .cell .lucide-slot {
        color: var(--ink-dim);
      }
      .name {
        font: 11px/1.2 ui-monospace, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .groups {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .group {
        border: 2px solid var(--paper-line);
        padding: 6px 8px;
      }
      .group .row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 28px;
      }
      .group .cap {
        font: 10px/1.2 ui-monospace, Consolas, monospace;
        color: var(--ink-dim);
        margin-top: 2px;
      }
      .use {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
      }
      .use > * {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dim {
        color: var(--ink-dim);
      }
      .danger {
        color: var(--danger);
      }
      .gold {
        color: var(--gold);
      }
      .cb {
        box-sizing: border-box;
        width: 16px;
        height: 16px;
        border: 2px solid var(--wood-dark);
        background: var(--paper);
        position: relative;
        gap: 0;
      }
      .cb svg {
        position: absolute;
        left: -2px;
        top: -2px;
      }
      .cb.on {
        background: var(--ink);
        color: var(--paper);
      }
      .btn {
        height: 28px;
        box-sizing: border-box;
        padding: 0 8px;
        border: 2px solid var(--wood-dark);
        background: var(--paper);
      }
      .btn.brand {
        background: var(--brand);
        color: var(--brand-foreground);
      }
      .btn.goldbg {
        background: var(--gold);
        color: #4a2f1b;
      }
      .spin {
        animation: spin 0.6s steps(4, end) infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./gallery.tsx"></script>
  </body>
</html>
