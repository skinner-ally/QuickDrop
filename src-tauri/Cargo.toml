[package]
name = "quickdrop"
version = "0.2.0"
description = "QuickDrop"
edition = "2021"

[lib]
name = "quickdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
futures-util = "0.3"
encoding_rs = "0.8"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Автозапуск — напрямую, без tauri-plugin-autostart: нужен режим Windows CurrentUser (только HKCU).
auto-launch = "0.6"

[target.'cfg(windows)'.dependencies]
# Состояние кнопки мыши для мини-окна (shell::capture_pointer_down); версия уже есть в Cargo.lock.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
