name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    # Установщики собираются и прикладываются к черновику только после зелёных проверок
    needs: web
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка и публикация черновика релиза
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'QuickDrop v__VERSION__'
          releaseDraft: true
          args: ${{ matrix.args }}

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # tauri-action называет релиз по версии из tauri.conf.json, а не по запушенному тегу
      - name: Проверка версии
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-version.mjs "$TAG"

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка веб-версии
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
